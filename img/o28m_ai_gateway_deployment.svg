<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<!--
SPDX-FileCopyrightText: 2026 Deutsche Telekom AG

SPDX-License-Identifier: Apache-2.0
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1000" height="720" viewBox="0 0 1000 720"
     font-family="Helvetica, Arial, sans-serif">

  <defs>
    <marker id="arr"       markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#545B64"/></marker>
    <marker id="arr-green" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#248814"/></marker>
    <marker id="arr-blue"  markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#147EBA"/></marker>
    <marker id="arr-pur"   markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#4D27AA"/></marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="720" fill="#FFFFFF"/>

  <!-- ═══════════════════════════════════════════════════
       INTERNET
  ═══════════════════════════════════════════════════ -->
  <ellipse cx="490" cy="46" rx="70" ry="30" fill="#232F3D"/>
  <text x="490" y="51" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">Internet</text>

  <!-- Internet → NLB -->
  <line x1="490" y1="76" x2="490" y2="98" stroke="#545B64" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ═══════════════════════════════════════════════════
       NLB
  ═══════════════════════════════════════════════════ -->
  <rect x="310" y="100" width="360" height="52" rx="6" fill="#4D27AA"/>
  <text x="490" y="121" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">Network Load Balancer (NLB)</text>
  <text x="490" y="141" text-anchor="middle" font-size="10" fill="#D4BBFF">internet-facing · port 443</text>

  <!-- NLB → Gateway ALB -->
  <path d="M 430 152 L 235 192" stroke="#545B64" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <!-- NLB → AI Gateway ALB -->
  <path d="M 550 152 L 755 192" stroke="#545B64" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

  <!-- ═══════════════════════════════════════════════════
       ALBs
  ═══════════════════════════════════════════════════ -->
  <!-- Gateway ALB -->
  <rect x="75" y="192" width="320" height="52" rx="6" fill="#4D27AA"/>
  <text x="235" y="213" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">Application Load Balancer (ALB)</text>
  <text x="235" y="232" text-anchor="middle" font-size="10" fill="#D4BBFF">gateway.&lt;your-hostname&gt;</text>

  <!-- AI Gateway ALB -->
  <rect x="605" y="192" width="320" height="52" rx="6" fill="#4D27AA"/>
  <text x="765" y="213" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">Application Load Balancer (ALB)</text>
  <text x="765" y="232" text-anchor="middle" font-size="10" fill="#D4BBFF">ai-gateway.&lt;your-hostname&gt;</text>

  <!-- Gateway ALB → Gateway box -->
  <line x1="235" y1="244" x2="235" y2="284" stroke="#545B64" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- AI Gateway ALB → AI Gateway box -->
  <line x1="765" y1="244" x2="765" y2="284" stroke="#545B64" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ═══════════════════════════════════════════════════
       EKS CLUSTER BOUNDARY
  ═══════════════════════════════════════════════════ -->
  <rect x="20" y="268" width="960" height="360" rx="10"
        fill="#E6F2F8" stroke="#D05C17" stroke-width="2.5" stroke-dasharray="10,5"/>
  <text x="40" y="291" font-size="13" font-weight="bold" fill="#D05C17">EKS Cluster (Kubernetes)</text>

  <!-- ═══════════════════════════════════════════════════
       GATEWAY deployment
  ═══════════════════════════════════════════════════ -->
  <rect x="35" y="300" width="330" height="210" rx="8" fill="#FFFFFF" stroke="#147EBA" stroke-width="2"/>
  <text x="200" y="323" text-anchor="middle" font-size="14" font-weight="bold" fill="#147EBA">Gateway</text>

  <rect x="55" y="333" width="290" height="38" rx="5" fill="#E6F2F8" stroke="#147EBA" stroke-width="1.5"/>
  <text x="200" y="357" text-anchor="middle" font-size="12" fill="#232F3E">Kong Proxy</text>

  <rect x="55" y="379" width="290" height="38" rx="5" fill="#E6F2F8" stroke="#147EBA" stroke-width="1.5"/>
  <text x="200" y="403" text-anchor="middle" font-size="12" fill="#232F3E">Gateway Jumper</text>

  <rect x="55" y="425" width="290" height="38" rx="5" fill="#E6F2F8" stroke="#147EBA" stroke-width="1.5"/>
  <text x="200" y="449" text-anchor="middle" font-size="12" fill="#232F3E">Issuer Service</text>

  <!-- ═══════════════════════════════════════════════════
       AI GATEWAY deployment
  ═══════════════════════════════════════════════════ -->
  <rect x="635" y="300" width="330" height="210" rx="8" fill="#FFFFFF" stroke="#4D27AA" stroke-width="2"/>
  <text x="800" y="323" text-anchor="middle" font-size="14" font-weight="bold" fill="#4D27AA">AI Gateway</text>

  <rect x="655" y="333" width="290" height="38" rx="5" fill="#F0E6FF" stroke="#4D27AA" stroke-width="1.5"/>
  <text x="800" y="357" text-anchor="middle" font-size="12" fill="#232F3E">Kong Proxy</text>

  <rect x="655" y="379" width="290" height="38" rx="5" fill="#F0E6FF" stroke="#4D27AA" stroke-width="1.5"/>
  <text x="800" y="403" text-anchor="middle" font-size="12" fill="#232F3E">Gateway Jumper</text>

  <rect x="655" y="425" width="290" height="38" rx="5" fill="#F0E6FF" stroke="#4D27AA" stroke-width="1.5"/>
  <text x="800" y="449" text-anchor="middle" font-size="12" fill="#232F3E">Issuer Service</text>

  <!-- ═══════════════════════════════════════════════════
       IRIS (shared)
  ═══════════════════════════════════════════════════ -->
  <rect x="385" y="348" width="230" height="90" rx="8" fill="#E9F3E6" stroke="#248814" stroke-width="2.5"/>
  <text x="500" y="374" text-anchor="middle" font-size="14" font-weight="bold" fill="#248814">Identity-Iris</text>
  <text x="500" y="396" text-anchor="middle" font-size="12" fill="#248814">(shared)</text>
  <text x="500" y="416" text-anchor="middle" font-size="11" fill="#545B64">iris.&lt;your-hostname&gt;</text>

  <!-- Gateway → Iris (auth, dashed green) -->
  <path d="M 365 393 L 385 393" stroke="#248814" stroke-width="1.5" stroke-dasharray="5,3" fill="none" marker-end="url(#arr-green)"/>
  <text x="375" y="385" text-anchor="middle" font-size="9" fill="#248814">auth</text>

  <!-- AI Gateway → Iris (auth, dashed green) -->
  <path d="M 635 393 L 615 393" stroke="#248814" stroke-width="1.5" stroke-dasharray="5,3" fill="none" marker-end="url(#arr-green)"/>
  <text x="625" y="385" text-anchor="middle" font-size="9" fill="#248814">auth</text>

  <!-- ═══════════════════════════════════════════════════
       Lines from deployments → outside EKS → RDS
  ═══════════════════════════════════════════════════ -->
  <!-- Gateway → gateway DB -->
  <line x1="175" y1="510" x2="175" y2="648" stroke="#147EBA" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-blue)"/>
  <!-- AI Gateway → ai_gateway DB -->
  <line x1="815" y1="510" x2="815" y2="648" stroke="#4D27AA" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-pur)"/>
  <!-- Iris → iris DB -->
  <line x1="500" y1="438" x2="500" y2="648" stroke="#248814" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-green)"/>

  <!-- ═══════════════════════════════════════════════════
       RDS AURORA
  ═══════════════════════════════════════════════════ -->
  <rect x="20" y="648" width="960" height="56" rx="8" fill="#FDF2E9" stroke="#D05C17" stroke-width="1.5" stroke-dasharray="7,4"/>
  <text x="500" y="716" text-anchor="middle" font-size="11" fill="#D05C17">RDS Aurora PostgreSQL</text>

  <!-- iris DB -->
  <rect x="390" y="656" width="220" height="32" rx="5" fill="#E9F3E6" stroke="#248814" stroke-width="1.5"/>
  <text x="500" y="677" text-anchor="middle" font-size="12" fill="#248814">Database: iris</text>

  <!-- gateway DB -->
  <rect x="50" y="656" width="220" height="32" rx="5" fill="#E6F2F8" stroke="#147EBA" stroke-width="1.5"/>
  <text x="160" y="677" text-anchor="middle" font-size="12" fill="#147EBA">Database: gateway</text>

  <!-- ai_gateway DB -->
  <rect x="710" y="656" width="240" height="32" rx="5" fill="#F0E6FF" stroke="#4D27AA" stroke-width="1.5"/>
  <text x="830" y="677" text-anchor="middle" font-size="12" fill="#4D27AA">Database: ai_gateway</text>

  <!-- Legend -->
  <rect x="20" y="635" width="960" height="8" fill="none"/>

</svg>
