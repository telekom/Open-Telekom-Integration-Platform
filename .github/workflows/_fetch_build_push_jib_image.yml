name: fetch_build_push_jib_image

on:
  workflow_call:
    inputs:
      source_repository:
        description: "Repository to fetch"
        required: true
        type: string
      source_branch:
        description: "Branch to fetch"
        required: false
        default: "main"
        type: string
      java_version:
        description: "Java version to use"
        required: false
        default: "25"
        type: string
      java_distribution:
        description: "Java distribution to use (e.g. temurin, zulu)"
        required: false
        default: "temurin"
        type: string
      target_image:
        description: "Full path, name and tag of the target image"
        required: true
        type: string
      target_registry:
        description: "Registry to push the image to"
        required: false
        default: ""
        type: string
      target_registry_username:
        description: "Username for the registry"
        required: false
        default: ""
        type: string
      target_platforms:
        description: "Comma-separated list of target platforms (e.g. linux/amd64,linux/arm64)"
        required: false
        default: ""
        type: string
      maven_args:
        description: "Additional Maven arguments"
        required: false
        default: ""
        type: string

    secrets:
      target_registry_password:
        description: "Password for the registry"
        required: false

jobs:
  build:
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source_repository }}
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ inputs.source_branch }}
          submodules: "true"
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: ${{ inputs.java_version }}
          distribution: ${{ inputs.java_distribution }}
          cache: "maven"

      - name: Log in to registry
        if: inputs.target_registry != ''
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.target_registry }}
          username: ${{ inputs.target_registry_username }}
          password: ${{ secrets.target_registry_password }}

      - name: Build image with Jib
        env:
          JIB_GOAL: ${{ inputs.target_registry != '' && 'jib:build' || 'jib:dockerBuild' }}
          MAVEN_ARGS: ${{ inputs.maven_args }}
          TARGET_IMAGE: ${{ inputs.target_image }}
          TARGET_PLATFORMS: ${{ inputs.target_platforms }}
        run: |
          read -r -a maven_args <<< "${MAVEN_ARGS//$'\n'/ }"
          target_platforms="${TARGET_PLATFORMS//[[:space:]]/}"
          platform_args=()
          if [[ -n "$target_platforms" ]]; then
            platform_args=("-Djib.from.platforms=$target_platforms")
          fi

          ./mvnw compile "$JIB_GOAL" -B \
            "-Djib.to.image=$TARGET_IMAGE" \
            "${platform_args[@]}" \
            "${maven_args[@]}"
